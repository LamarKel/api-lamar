spring.application.name=api-lamar

# Uploads (API Gateway acepta máximo ~6MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:uploads}
app.s3-bucket=${S3_BUCKET:}

# Base de datos (local por defecto; en AWS llega de las variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT
jwt.secret=${JWT_SECRET:RodbergApiLamarSecretKey2026SuperSeguraXYZ123}
jwt.expiration=86400000