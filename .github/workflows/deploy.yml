name: Deploy Serverless (Terraform + Lambda)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_image_tag: ${{ github.sha }}

jobs:
  # --------------------------------------------------------------
  # JOB 1: Build + Test del backend
  # --------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Postgres temporal para que las pruebas de Spring tengan BD
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: api_lamar
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Instalar dependencias
        run: mvn -B dependency:go-offline

      - name: Ejecutar pruebas
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/api_lamar
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: clave-de-pruebas-solo-para-ci-1234567890abcdef
        run: mvn -B test

      - name: Construir proyecto
        run: mvn -B package -DskipTests

      - name: Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: target/*.jar

  # --------------------------------------------------------------
  # JOB 2: Terraform + empaquetar Lambda + desplegar
  # --------------------------------------------------------------
  deploy:
    name: Terraform & Deploy
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Validate
        run: terraform validate

      # La Lambda necesita que la imagen exista en ECR, así que el
      # repositorio se crea primero.
      - name: Crear repositorio ECR
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.api -target=aws_ecr_lifecycle_policy.api

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Empaquetar Lambda (build y push de imagen Docker)
        working-directory: .
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/api-lamar:${{ github.sha }}
          docker build --platform linux/amd64 --provenance=false -t $IMAGE .
          docker push $IMAGE

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply (Deploy Lambda)
        run: terraform apply -input=false -auto-approve tfplan

      - name: Mostrar URL de la API
        run: |
          echo "### 🚀 API desplegada" >> $GITHUB_STEP_SUMMARY
          echo "URL: $(terraform output -raw api_url)" >> $GITHUB_STEP_SUMMARY
          terraform output
